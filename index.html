<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ekin/favicon.svg" />
    <link rel="apple-touch-icon" href="/ekin/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#141019" />
    <title>Ekin</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ekin:theme')
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      /* Prevent accidental zoom on mobile: block double-tap zoom, keep scroll/tap. */
      html {
        touch-action: manipulation;
      }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no, so block pinch-zoom explicitly.
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault()
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
